---
layout: default
---
<article class="post wrap">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-sub">{{ page.subtitle }}</p>{% endif %}
    <p class="byline">{% if page.author %}{{ page.author }}, {% endif %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="post-back"><a href="/blog/">All posts</a></p>
</article>
